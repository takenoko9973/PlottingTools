[project]
name = "plotting-tools"
version = "0.3.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
